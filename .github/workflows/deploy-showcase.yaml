name: Deploy showcase

# Deploys showcase/ (ui.zeyo.dev) on every push to main.
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID come from the production environment, which only
# accepts jobs from main: branches and pull requests can never reach them.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-showcase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm showcase:deploy
