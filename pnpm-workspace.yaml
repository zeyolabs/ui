packages:
  - showcase

overrides:
  sharp: 0.35.5
  undici: 8.13.1

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Our own packages are trusted the day they are released; everything else waits out pnpm's
# minimumReleaseAge supply-chain delay.
minimumReleaseAgeExclude:
  - '@zeyolabs/*'
