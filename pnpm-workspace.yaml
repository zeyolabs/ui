packages:
  - showcase

overrides:
  sharp: 0.35.5
  undici: 7.30.1

allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true

# Our own packages are trusted the day they are released; everything else waits out pnpm's
# minimumReleaseAge supply-chain delay.
minimumReleaseAgeExclude:
  - '@zeyolabs/*'
